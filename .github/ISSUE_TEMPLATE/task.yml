name: Task
description: One unit of work for one agent or person, in one PR. See docs/collaboration/writing-tasks.md
title: "[M?] "
labels: ["status:needs-spec"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What exists after this task that didn't before, and why. One or two sentences.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Exact paths this task may create or change. Used to check overlaps with other tasks.
      placeholder: "functions/ledger/**"
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: Nearby things this task must not do.
    validations:
      required: true
  - type: textarea
    id: read-first
    attributes:
      label: Read first
      description: Links to the doc sections needed.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: A checklist of observable, testable results.
      placeholder: "- [ ] ..."
    validations:
      required: true
  - type: input
    id: depends-on
    attributes:
      label: Depends on
      description: Issues that must be closed first, e.g. "#3, #5", or "none".
    validations:
      required: true
  - type: textarea
    id: test-plan
    attributes:
      label: Test plan
      description: Tests to add and commands that prove it works.
    validations:
      required: true
