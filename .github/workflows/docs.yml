name: Docs

# Checks every Markdown file's relative links, and the runbooks' jq blocks against the reads script
# (environments-and-deploys.md#cicd-github-actions). Every pull request runs, with no paths filter:
# a docs-only PR gets no `ci` but can change a block, and a code PR can break a link by moving a
# file. A draft runs once it's marked ready.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A new push to a PR cancels that PR's older runs.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  docs:
    name: docs
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Node's built-ins only, so no cache and no `npm ci`.
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      # Names the file: `node --test scripts/` doesn't search a folder on Node 24.
      - run: node --test scripts/check-links.test.mjs

      - run: node scripts/check-links.mjs

      # The nightly-check and error-line reads' script, against the jq blocks in nightly-check.md
      # and error-lines.md (#553), which a docs-only PR can change, and the reads job's state and
      # posts (#568). Built-ins only, so no `npm ci`. jq is on the runner's image.
      - run: node --test scripts/reads.test.mjs scripts/reads-job.test.mjs
