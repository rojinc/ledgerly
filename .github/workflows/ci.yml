name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR cancels that PR's older runs. Each push to main gets its own
# group, so no run on main is ever cancelled, even while it waits in the queue.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test
        env:
          TZ: UTC

      # Core again in another timezone to catch date bugs, with full coverage.
      - run: npm run coverage -w @ledgerly/core
        env:
          TZ: Australia/Sydney

      # Every workspace again in Sydney time: functions and the web app handle local dates
      # too, and must not depend on the machine's timezone either (testing.md#rules).
      - run: npm test
        env:
          TZ: Australia/Sydney

      - run: npm run build
