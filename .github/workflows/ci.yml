name: CI

# Pull requests only, so Actions minutes last (environments-and-deploys.md#cicd-github-actions):
# main is checked by the lead's local gates on each merge, and Deploy builds it again. Docs-only
# changes don't run, and a draft runs once it's marked ready.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

# A new push to a PR cancels that PR's older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test
        env:
          TZ: UTC

      # Core again in another timezone to catch date bugs, with full coverage.
      - run: npm run coverage -w @ledgerly/core
        env:
          TZ: Australia/Sydney

      # The functions and packages/server again in Sydney time: they handle local dates too (the
      # server package formats the dates emails and PDFs show), and must not depend on the
      # machine's timezone either (testing.md#rules). Core's Sydney run is the coverage step above.
      - run: npm test -- --project '@ledgerly/fn-*' --project '@ledgerly/server'
        env:
          TZ: Australia/Sydney

      - run: npm run build
