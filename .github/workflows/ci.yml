name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a branch cancels its older runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test
        env:
          TZ: UTC

      # Core again in another timezone to catch date bugs, with full coverage.
      - run: npm run coverage -w @ledgerly/core
        env:
          TZ: Australia/Sydney

      - run: npm run build
