name: Deploy

# A push to main deploys to dev. Prod deploys only when the owner runs this workflow by hand on
# a release tag; agents never do (AGENTS.md, environments-and-deploys.md#cicd-github-actions).
on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy per environment at a time, and never cancelled half-way through a push.
concurrency:
  group: deploy-${{ github.event_name == 'workflow_dispatch' && 'prod' || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read

# An explicit bash adds `-o pipefail`, so a failing command before a pipe fails its step.
defaults:
  run:
    shell: bash

jobs:
  deploy:
    name: deploy ${{ github.event_name == 'workflow_dispatch' && 'prod' || 'dev' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.event_name == 'workflow_dispatch' && 'production' || 'dev' }}
    # The API key is passed only to the steps that need it, never to npm or the build. The
    # `|| ''` keeps a missing prod secret from falling back to the dev one.
    env:
      IS_PROD: ${{ github.event_name == 'workflow_dispatch' }}
      CONFIG: ${{ github.event_name == 'workflow_dispatch' && 'appwrite.config.prod.json' || 'appwrite.config.json' }}
      APPWRITE_ENDPOINT: ${{ secrets.APPWRITE_ENDPOINT }}
      PROJECT_ID: ${{ github.event_name == 'workflow_dispatch' && secrets.APPWRITE_PROD_PROJECT_ID || github.event_name != 'workflow_dispatch' && secrets.APPWRITE_DEV_PROJECT_ID || '' }}
    steps:
      # Until the owner adds the secrets (#3), a dev deploy is skipped with a warning. A prod
      # deploy, or a dev one with only some of its secrets, fails instead.
      - name: Check the secrets
        id: secrets
        env:
          API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.APPWRITE_PROD_API_KEY || github.event_name != 'workflow_dispatch' && secrets.APPWRITE_DEV_API_KEY || '' }}
        run: |
          if [ -n "$APPWRITE_ENDPOINT" ] && [ -n "$PROJECT_ID" ] && [ -n "$API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          elif [ "$IS_PROD" = "true" ]; then
            echo "::error::The prod deploy secrets aren't set."
            exit 1
          elif [ -n "$APPWRITE_ENDPOINT$PROJECT_ID$API_KEY" ]; then
            echo "::error::Only some of the dev deploy secrets are set."
            exit 1
          else
            echo "::warning::Dev deploy skipped: the APPWRITE_* secrets aren't set yet (#3)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          persist-credentials: false
          # The whole history, so a release tag can be checked against main.
          fetch-depth: 0

      # A prod run must be started on a release tag (vMAJOR.MINOR.PATCH) whose commit is on main.
      - name: Check the release tag
        if: steps.secrets.outputs.ready == 'true' && github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ] || ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Run the prod deploy on a release tag (vMAJOR.MINOR.PATCH), not on $GITHUB_REF_NAME."
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      # The CLI takes the endpoint from APPWRITE_ENDPOINT over the config file's, and the config
      # file names the project, so this is the only check that the secrets and the file agree.
      - name: Check the config matches the secrets
        if: steps.secrets.outputs.ready == 'true'
        run: |
          node -e '
            const { CONFIG, APPWRITE_ENDPOINT, PROJECT_ID } = process.env
            const config = require("./" + CONFIG)
            if (config.endpoint !== APPWRITE_ENDPOINT || config.projectId !== PROJECT_ID) {
              console.error("::error::" + CONFIG + " names another project or endpoint than the secrets.")
              process.exit(1)
            }
          '

      - uses: actions/setup-node@v6
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - if: steps.secrets.outputs.ready == 'true'
        run: npm ci

      # Builds the function bundles, and the web app for this project.
      - if: steps.secrets.outputs.ready == 'true'
        run: npm run build
        env:
          VITE_APPWRITE_ENDPOINT: ${{ env.APPWRITE_ENDPOINT }}
          VITE_APPWRITE_PROJECT_ID: ${{ env.PROJECT_ID }}

      - name: Install the Appwrite CLI
        if: steps.secrets.outputs.ready == 'true'
        run: npm install --global appwrite-cli@28.7.0

      - name: Push tables, buckets, functions and the web site
        if: steps.secrets.outputs.ready == 'true'
        env:
          API_KEY: ${{ github.event_name == 'workflow_dispatch' && secrets.APPWRITE_PROD_API_KEY || github.event_name != 'workflow_dispatch' && secrets.APPWRITE_DEV_API_KEY || '' }}
        run: |
          appwrite client --endpoint "$APPWRITE_ENDPOINT" --project-id "$PROJECT_ID" --key "$API_KEY"
          push() {
            appwrite push "$@" --all --force --config-file "$CONFIG" 2>&1 | tee push.log
            # The CLI can exit 0 after a failure ("✗ Error: …", or "Deployed 4 of 5 functions
            # … 1 failed."), so read what it printed too.
            if grep -qE '✗|Deployed [0-9]+ of [0-9]+ .* failed' push.log; then
              echo "::error::appwrite push $1 failed."
              exit 1
            fi
          }
          push table
          push bucket
          push function
          push site
